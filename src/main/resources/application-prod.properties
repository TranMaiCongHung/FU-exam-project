# Chuyển driver sang PostgreSQL cho Neon (local vẫn dùng SQL Server ở application.properties)
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tối ưu cho Neon Free + Render 512MB RAM
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=35000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=300000

# Giảm log & tiết kiệm RAM trên 512MB container
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.tomcat.threads.max=20