spring.application.name=FUExam

server.forward-headers-strategy=native
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
springdoc.swagger-ui.path=/api-docs

server.servlet.context-path=/
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
spring.mvc.format.date=dd/MM/yyyy
spring.mvc.format.date-time=dd/MM/yyyy HH:mm:ss

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Khai báo các email admin
app.admin.emails=${ADMIN_EMAILS}

r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket=${R2_BUCKET}
r2.public-url=${R2_PUBLIC_URL}

gemini.api.url=${GEMINI_API_URL}
gemini.api.key=${GEMINI_API_KEY:${GOOGLE_API_KEY}}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
